name: Package Stick Builder

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/win-stick-builder/**'
      - '.github/workflows/stick-builder.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip the tool (tracked files: scripts + author's binaries; no third-party APKs)
        run: |
          cd tools
          zip -r ../GeelyStickBuilder.zip win-stick-builder -x 'win-stick-builder/assets/.gitignore'
          cd ..
          unzip -l GeelyStickBuilder.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeelyStickBuilder
          path: GeelyStickBuilder.zip
          if-no-files-found: error

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stick-builder
          name: Stick Builder (Windows)
          body: "Geely Stick Builder (Windows GUI): detect USB, format FAT32, write a boot-hook stick from the ticked features. Unzip and run Run-GeelyStickBuilder.cmd. Bundles the author's own kit (scripts + binaries); adbd_root is build-specific (see docs/03). Only third-party APKs (e.g. Settings) are left out — add your own."
          files: GeelyStickBuilder.zip
